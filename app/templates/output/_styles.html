<style>
  :root {
    --quote-deep: #1e3a8a;
    --quote-primary: #1d4ed8;
    --quote-bright: #3b82f6;
    --quote-mint: #eff6ff;
    --quote-pale: #f8fafc;
    --quote-ink: #1e293b;
    --quote-muted: #64748b;
    --quote-line: #bfdbfe;
    --quote-warm: #f5b940;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    color: var(--quote-ink);
    background: #e2e8f0;
    font-family: "Noto Sans TC", "Noto Sans SC", "Noto Sans", Arial, sans-serif;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .quote-sheet {
    width: 720px;
    margin: 0 auto;
    background: #fff;
    overflow: hidden;
  }
  .hero {
    padding: 40px 44px 30px;
    color: #fff;
    background: linear-gradient(135deg, var(--quote-deep), var(--quote-primary));
    position: relative;
  }
  .hero:after {
    content: "";
    width: 190px;
    height: 190px;
    border: 32px solid rgba(255,255,255,.08);
    border-radius: 50%;
    position: absolute;
    right: -75px;
    top: -88px;
  }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 18px; letter-spacing: .05em; }
  .brand-logo { width: 48px; height: 48px; border-radius: 13px; background: #fff; overflow: hidden; display: grid; place-items: center; }
  .brand-logo img { width: 100%; height: 100%; object-fit: contain; transform: scale(1.2); }
  .hero h1 { margin: 28px 0 6px; font-size: 38px; line-height: 1.2; letter-spacing: -.02em; }
  .hero-subtitle { margin: 0; opacity: .85; font-size: 17px; }
  .quote-number { margin-top: 24px; font-size: 13px; opacity: .85; }
  .content { padding: 28px; }
  .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 28px; }
  .summary-item { background: var(--quote-pale); border: 1px solid var(--quote-line); border-radius: 14px; padding: 13px 15px; min-width: 0; }
  .summary-label { color: var(--quote-muted); font-size: 12px; margin-bottom: 4px; }
  .summary-value { font-weight: 750; font-size: 15px; overflow-wrap: anywhere; }
  .section { margin-top: 30px; }
  .section-heading { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .section-number { width: 29px; height: 29px; border-radius: 9px; background: var(--quote-primary); color: #fff; display: grid; place-items: center; font-weight: 800; }
  .section h2 { margin: 0; color: var(--quote-deep); font-size: 22px; }
  .plan-grid { display: grid; grid-template-columns: repeat(var(--plan-count, 2), minmax(0, 1fr)); gap: 12px; }
  .plan-card { position: relative; border: 2px solid var(--quote-line); border-radius: 18px; padding: 20px 16px 17px; background: #fff; min-width: 0; }
  .plan-card.recommended { border-color: var(--quote-bright); background: linear-gradient(180deg, #eff6ff, #fff); box-shadow: 0 8px 24px rgba(29,78,216,.12); }
  .recommended-badge { position: absolute; top: -11px; right: 12px; color: #fff; background: var(--quote-bright); border-radius: 999px; padding: 5px 10px; font-size: 11px; font-weight: 800; }
  .plan-name { min-height: 42px; font-weight: 800; color: var(--quote-deep); font-size: 16px; }
  .plan-price { margin-top: 12px; font-size: 28px; line-height: 1; font-weight: 900; letter-spacing: -.04em; color: var(--quote-ink); }
  .plan-period { color: var(--quote-muted); font-size: 11px; margin-top: 7px; }
  .plan-note { font-size: 12px; margin-top: 9px; color: var(--quote-muted); }
  .savings { margin-top: 13px; border-radius: 14px; background: var(--quote-deep); color: #fff; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
  .savings strong { font-size: 20px; }
  .coverage-list { border: 1px solid var(--quote-line); border-radius: 18px; overflow: hidden; }
  .coverage-row { padding: 16px 18px; display: grid; grid-template-columns: 225px 1fr; gap: 18px; background: #fff; }
  .coverage-row + .coverage-row { border-top: 1px solid var(--quote-line); }
  .coverage-name { font-size: 14px; font-weight: 800; color: var(--quote-deep); }
  .coverage-value { display: inline-block; margin-top: 8px; color: #fff; background: var(--quote-primary); border-radius: 999px; padding: 6px 11px; font-size: 12px; font-weight: 700; max-width: 100%; overflow-wrap: anywhere; }
  .coverage-description { font-size: 13px; line-height: 1.6; }
  .coverage-example { margin-top: 5px; color: var(--quote-muted); font-size: 11px; line-height: 1.5; }
  .renters-card { background: var(--quote-mint); border-radius: 18px; padding: 20px; border-left: 6px solid var(--quote-bright); }
  .renters-card h3 { margin: 0; color: var(--quote-deep); font-size: 18px; }
  .renters-card ul { margin: 14px 0 8px; padding: 0; list-style: none; display: grid; gap: 9px; }
  .renters-card li { position: relative; padding-left: 28px; font-size: 14px; font-weight: 650; }
  .renters-card li:before { content: "✓"; position: absolute; left: 0; top: -1px; width: 20px; height: 20px; border-radius: 50%; color: #fff; background: var(--quote-bright); text-align: center; line-height: 20px; font-weight: 900; }
  .renters-subtitle { color: var(--quote-muted); font-size: 11px; }
  .contact-card { display: grid; grid-template-columns: 1fr auto; gap: 18px; background: var(--quote-deep); color: #fff; border-radius: 18px; padding: 22px; align-items: center; }
  .contact-card h3 { font-size: 18px; margin: 0 0 10px; }
  .contact-line { font-size: 13px; line-height: 1.7; overflow-wrap: anywhere; }
  .qr-box { width: 112px; height: 112px; border-radius: 12px; background: #fff; padding: 5px; overflow: hidden; }
  .qr-image { display: block; width: 100%; height: 100%; object-fit: contain; }
  .customer-note { border-left: 4px solid var(--quote-warm); background: #fff9eb; padding: 12px 15px; border-radius: 8px; font-size: 13px; line-height: 1.6; margin-top: 18px; }
  .disclaimer { color: var(--quote-muted); font-size: 10px; line-height: 1.55; margin-top: 22px; padding-top: 15px; border-top: 1px solid var(--quote-line); }
  .footer-stripe { height: 12px; background: linear-gradient(90deg, var(--quote-deep), var(--quote-bright)); }
</style>
